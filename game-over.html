<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Over</title>
</head>

<body class="game-over-body">

    <img class="game-over-img" src="/public/assets/images/code-theme/game-over-screen/game-over.png" alt="">

    <div class="score">
        <p>Final score</p>
        <div class="score__box">
            <div class="score__box__blue">
                <img src="/public/assets/images/code-theme/game-screen/blue-player.png" alt="">
                <p>Blue: <span id="finalScoreBlue">0</span></p>
            </div>
            <div class="score__box__orange">
                <img src="/public/assets/images/code-theme/game-screen/orange-player.png" alt="">
                <p>Orange: <span id="finalScoreOrange">0</span></p>
            </div>
        </div>
    </div>

</body>

<script type="module" src="./src/results.ts"></script>

</html>
