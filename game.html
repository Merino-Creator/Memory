<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>

</head>

<body>

    <header class="game-header">
        <div class="player-points">
            <div class="player-points__box player-points__box--blue">
                <span class="player-points__icon"></span>
                <p><span class="player-points__label">Blue: </span><span id="scoreBlue">0</span></p>
            </div>
            <div class="player-points__box player-points__box--orange">
                <span class="player-points__icon"></span>
                <p><span class="player-points__label">Orange: </span><span id="scoreOrange">0</span></p>
            </div>
        </div>
        <div class="player-turn">
            <p>Current player:</p>
            <img id="currentPlayerImg" src="" alt="">
        </div>
        <button class="exit-game-btn" id="openBtn"><img src="" alt=""></button>
    </header>

    <a href="/draw.html">draw</a>
    <a href="/game-over.html">over</a>
    <a href="/win-screen.html">win</a>

    <dialog id="exitDialog" class="exit-dialog">
        <h2 class="exit-dialog__headline">Are you sure you want to quit the game?</h2>
        <div class="exit-dialog__buttons">
            <button id="cancelExitBtn" class="exit-dialog__btn exit-dialog__btn--cancel"></button>
            <button id="confirmExitBtn" class="exit-dialog__btn exit-dialog__btn--confirm"></button>
        </div>
    </dialog>

    <div id="gameBoard" class="game-board"></div>

</body>

<script type="module" src="./src/game.ts"></script>

</html>
