<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>

</head>

<body>

    <header class="game-header">
        <div class="player-points">
            <div class="player-points__box">
                <img src="/public/assets/images/code-theme/game-screen/blue-player.png" alt="">
                <p class="player-points__box--blue">Blue: <span id="scoreBlue">0</span></p>
            </div>
            <div class="player-points__box">
                <img src="/public/assets/images/code-theme/game-screen/orange-player.png" alt="">
                <p class="player-points__box--orange">Orange: <span id="scoreOrange">0</span></p>
            </div>
        </div>
        <div class="player-turn">
            <p>Current player:</p>
            <img src="/public/assets/images/code-theme/game-screen/blue-player.png" alt="">
        </div>
        <button class="exit-game-btn" id="openBtn"><img src="/public/assets/images/buttons/exit-btn.png"
                alt=""></button>
    </header>

    <dialog id="exitDialog" class="exit-dialog">
        <h2 class="exit-dialog__headline">Are you sure you want to quit the game?</h2>
        <div class="exit-dialog__buttons">
            <button id="cancelExitBtn" class="exit-dialog__btn exit-dialog__btn--cancel">
                <img class="exit-dialog__btn-img" src="/public/assets/images/code-theme/buttons/back-btn-it.png" alt="">
            </button>
            <button id="confirmExitBtn" class="exit-dialog__btn exit-dialog__btn--confirm">
                <img class="exit-dialog__btn-img" src="/public/assets/images/code-theme/buttons/exit-btn-it.png" alt="">
            </button>
        </div>
    </dialog>

    <div id="gameBoard" class="game-board"></div>

</body>

<script type="module" src="./src/game.ts"></script>

</html>
