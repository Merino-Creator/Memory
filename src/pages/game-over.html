<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Over</title>

    <link rel="icon" type="image/png" href="/assets/images/da-projects-theme/game-screen/player-status.png">
</head>

<body class="result-screen game-over-screen">

    <main class="result-content">
        <h1 class="visually-hidden">Game over</h1>
        <img class="game-over-img" alt="">

        <section class="score">
            <h2 class="score__title">Final score</h2>

            <div class="score__box">
                <div class="score__box__blue">
                    <span class="score__icon"></span>
                    <p>Blue: <span id="finalScoreBlue">0</span></p>
                </div>
                <div class="score__box__orange">
                    <span class="score__icon"></span>
                    <p>Orange: <span id="finalScoreOrange">0</span></p>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="/results.ts"></script>
</body>

</html>
