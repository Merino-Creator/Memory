<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>

    <link rel="icon" type="image/png" href="/assets/images/da-projects-theme/game-screen/player-status.png">
</head>

<body>

    <header class="game-header">
        <h1 class="visually-hidden">Memory</h1>

        <div class="player-points">
            <div class="player-points__box player-points__box--blue">
                <span class="player-points__icon"></span>
                <p><span class="player-points__label">Blue: </span><span id="scoreBlue" class="player-points__score">0</span></p>
            </div>
            <div class="player-points__box player-points__box--orange">
                <span class="player-points__icon"></span>
                <p><span class="player-points__label">Orange: </span><span id="scoreOrange" class="player-points__score">0</span></p>
            </div>
        </div>

        <div class="player-turn" data-player="blue">
            <p>Current player:</p>
            <span class="player-turn__icon"></span>
        </div>

        <button class="exit-game-btn" id="openExitBtn" type="button">
            <span class="exit-game-btn__icon"></span>
            <span class="exit-game-btn__text">Exit game</span>
        </button>
    </header>

    <dialog id="exitDialog" class="exit-dialog">
        <h2 class="exit-dialog__headline">Are you sure you want to quit the game?</h2>
        <div class="exit-dialog__buttons">
            <button id="cancelExitBtn" class="exit-dialog__btn exit-dialog__btn--cancel" type="button">Back to
                game</button>
            <button id="confirmExitBtn" class="exit-dialog__btn exit-dialog__btn--confirm" type="button">Exit
                game</button>
        </div>
    </dialog>

    <main id="gameBoard" class="game-board"></main>

    <script type="module" src="/game.ts"></script>
</body>

</html>
