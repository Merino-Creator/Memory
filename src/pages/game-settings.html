<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>

    <link rel="icon" type="image/png" href="/assets/images/da-projects-theme/game-screen/player-status.png">
</head>

<body>

    <main class="settings-content">

        <header class="settings-headline">
            <h1>Settings</h1>
            <img src="/assets/images/settings-screen/underline.png" alt="">
        </header>

        <div class="settings-content-box">

            <section class="settings-box-left">
                <h2 class="visually-hidden">Game options</h2>

                <fieldset class="game-themes">
                    <legend class="game-themes-head">
                        <img src="/assets/images/settings-screen/palette.png" alt="">
                        <span>Game themes</span>
                    </legend>

                    <label class="custom-checkbox" data-preview-key="code-vibes">
                        <input type="radio" name="theme">
                        <span class="circle"></span>
                        <span class="label-text" data-text="Code vibes theme">Code vibes theme</span>
                        <img class="selected-arrow-img" src="/assets/images/settings-screen/line.png" alt="">
                    </label>

                    <label class="custom-checkbox" data-preview-key="da-projects">
                        <input type="radio" name="theme">
                        <span class="circle"></span>
                        <span class="label-text" data-text="DA Projects theme">DA Projects theme</span>
                        <img class="selected-arrow-img" src="/assets/images/settings-screen/line.png" alt="">
                    </label>
                </fieldset>

                <fieldset class="choose-player">
                    <legend class="player-head">
                        <img src="/assets/images/settings-screen/pawn.png" alt="">
                        <span>Choose player</span>
                    </legend>

                    <label class="custom-checkbox">
                        <input type="radio" name="player">
                        <span class="circle"></span>
                        <span class="label-text" data-text="Blue">Blue</span>
                        <img class="selected-arrow-img" src="/assets/images/settings-screen/line.png" alt="">
                    </label>

                    <label class="custom-checkbox">
                        <input type="radio" name="player">
                        <span class="circle"></span>
                        <span class="label-text" data-text="Orange">Orange</span>
                        <img class="selected-arrow-img" src="/assets/images/settings-screen/line.png" alt="">
                    </label>
                </fieldset>

                <fieldset class="board-size">
                    <legend class="board-head">
                        <img src="/assets/images/settings-screen/board.png" alt="">
                        <span>Board size</span>
                    </legend>

                    <label class="custom-checkbox">
                        <input type="radio" name="board">
                        <span class="circle"></span>
                        <span class="label-text" data-text="16 cards">16 cards</span>
                        <img class="selected-arrow-img" src="/assets/images/settings-screen/line.png" alt="">
                    </label>

                    <label class="custom-checkbox">
                        <input type="radio" name="board">
                        <span class="circle"></span>
                        <span class="label-text" data-text="24 cards">24 cards</span>
                        <img class="selected-arrow-img" src="/assets/images/settings-screen/line.png" alt="">
                    </label>

                    <label class="custom-checkbox">
                        <input type="radio" name="board">
                        <span class="circle"></span>
                        <span class="label-text" data-text="36 cards">36 cards</span>
                        <img class="selected-arrow-img" src="/assets/images/settings-screen/line.png" alt="">
                    </label>
                </fieldset>
            </section>

            <section class="settings-box-right" data-preview="code-vibes">
                <h2 class="visually-hidden">Theme preview and summary</h2>

                <img class="preview-img" src="/assets/images/settings-screen/it-theme-logo.png"
                    alt="Preview of the selected theme">

                <div class="election-line">
                    <span class="theme-value">Theme</span>
                    <img src="/assets/images/settings-screen/seperation-line.png" alt="">
                    <span class="player-value">Player</span>
                    <img src="/assets/images/settings-screen/seperation-line.png" alt="">
                    <span class="board-value">Board size</span>

                    <button class="start-btn" type="button" disabled>
                        <img class="start-btn-img" src="/assets/images/settings-screen/smart-display.png" alt="">
                        <span>Start</span>
                    </button>
                </div>
            </section>

        </div>

    </main>

    <script type="module" src="/main.ts"></script>
</body>

</html>
