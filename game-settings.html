<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>

</head>

<body>

    <div class="settings-content">

        <div class="settings-headline">
            <h2>Settings</h2>
            <img src="/assets/images/settings-screen/underline.png" alt="">
        </div>

        <div class="settings-content-box">

            <div class="settings-box-left">

                <div class="game-themes">
                    <div class="game-themes-head">
                        <img src="/assets/images/settings-screen/palette.png" alt="">
                        <h3>Game themes</h3>
                    </div>
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="circle"></span>
                        Code vibes theme
                    </label>

                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="circle"></span>
                        DA Projects theme
                    </label>
                </div>

                <div class="choose-player">
                    <div class="player-head">
                        <img src="/assets/images/settings-screen/pawn.png" alt="">
                        <h3>Choose player</h3>
                    </div>
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="circle"></span>
                        Blue
                    </label>

                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="circle"></span>
                        Orange
                    </label>
                </div>

                <div class="board-size">
                    <div class="board-head">
                        <img src="/assets/images/settings-screen/board.png" alt="">
                        <h3>Board size</h3>
                    </div>
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="circle"></span>
                        16 cards
                    </label>

                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="circle"></span>
                        24 cards
                    </label>
                    
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="circle"></span>
                        36 cards
                    </label>
                </div>
            </div>

            <div class="settings-box-right">
                <img src="/assets/images/settings-screen/it-theme-logo.png" alt="">
                <div id="electionLine" class="election-line"></div>
            </div>

        </div>

    </div>

</body>

<script type="module" src="./src/main.ts"></script>

</html>
