<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>

</head>

<body>

    <div class="settings-content">

        <div class="settings-headline">
            <h2>Settings</h2>
            <img src="/assets/images/settings-screen/underline.png" alt="">
        </div>

        <div class="settings-content-box">

            <div class="settings-box-left">

                <div class="game-themes">
                    <div class="game-themes-head">
                        <img src="/assets/images/settings-screen/palette.png" alt="">
                        <h3>Game themes</h3>
                    </div>
                    <label class="custom-checkbox">
                        <input type="radio" name="theme" checked>
                        <span class="circle"></span>
                        <span class="label-text" data-text="Code vibes theme">Code vibes theme</span>
                        <img class="selected-arrow-img" src="/public/assets/images/settings-screen/line.png" alt="">
                    </label>

                    <label class="custom-checkbox">
                        <input type="radio" name="theme">
                        <span class="circle"></span>
                        <span class="label-text" data-text="DA Projects theme">DA Projects theme</span>
                        <img class="selected-arrow-img" src="/public/assets/images/settings-screen/line.png" alt="">
                    </label>
                </div>

                <div class="choose-player">
                    <div class="player-head">
                        <img src="/assets/images/settings-screen/pawn.png" alt="">
                        <h3>Choose player</h3>
                    </div>
                    <label class="custom-checkbox">
                        <input type="radio" name="player">
                        <span class="circle"></span>
                        <span class="label-text" data-text="Blue">Blue</span>
                        <img class="selected-arrow-img" src="/public/assets/images/settings-screen/line.png" alt="">
                    </label>

                    <label class="custom-checkbox">
                        <input type="radio" name="player">
                        <span class="circle"></span>
                        <span class="label-text" data-text="Orange">Orange</span>
                        <img class="selected-arrow-img" src="/public/assets/images/settings-screen/line.png" alt="">
                    </label>
                </div>

                <div class="board-size">
                    <div class="board-head">
                        <img src="/assets/images/settings-screen/board.png" alt="">
                        <h3>Board size</h3>
                    </div>
                    <label class="custom-checkbox">
                        <input type="radio" name="board">
                        <span class="circle"></span>
                        <span class="label-text" data-text="16 cards">16 cards</span>
                        <img class="selected-arrow-img" src="/public/assets/images/settings-screen/line.png" alt="">
                    </label>

                    <label class="custom-checkbox">
                        <input type="radio" name="board">
                        <span class="circle"></span>
                        <span class="label-text" data-text="24 cards">24 cards</span>
                        <img class="selected-arrow-img" src="/public/assets/images/settings-screen/line.png" alt="">
                    </label>

                    <label class="custom-checkbox">
                        <input type="radio" name="board">
                        <span class="circle"></span>
                        <span class="label-text" data-text="36 cards">36 cards</span>
                        <img class="selected-arrow-img" src="/public/assets/images/settings-screen/line.png" alt="">
                    </label>
                </div>
            </div>

            <div class="settings-box-right">
                <img class="preview-img" src="/assets/images/settings-screen/it-theme-logo.png" alt="">
                <div id="electionLine" class="election-line">
                    <p>Theme</p>
                    <img src="./public/assets/images/settings-screen/seperation-line.png" alt="">
                    <p>Player</p>
                    <img src="./public/assets/images/settings-screen/seperation-line.png" alt="">
                    <p>Board size</p>
                    <button class="start-btn" disabled><img src="./public/assets/images/settings-screen/start-button-disabled.png" alt=""></button>
                </div>
            </div>

        </div>

    </div>

</body>

<script type="module" src="./src/main.ts"></script>

</html>
